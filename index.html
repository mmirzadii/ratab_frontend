<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="رتب، پنل فارسی و ساده برای مدیریت صورت‌بها، فهرست‌بها و اسناد مالی پروژه"
    />
    <meta name="enamad" content="27516986" />
    <title>رتب | پنل توسعه</title>
    <script>
      (function () {
        try {
          var stored =
            localStorage.getItem("metril.theme") || localStorage.getItem("ratab.theme");
          var theme = stored === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (_err) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
