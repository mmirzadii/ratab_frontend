        required: true
      tags:
      - coefficient-values
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectCoefficientValueRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProjectCoefficientValueRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectCoefficientValueRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCoefficientValue'
          description: ''
    delete:
      operationId: coefficient_values_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این project coefficient value را شناسایی
