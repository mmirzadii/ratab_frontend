    OfficialCalculationRequestRequest:
      type: object
      description: |-
        Request body for POST .../official-calculations/. Mirrors the pricebook
        item calculate inputs plus the required document-scoped billing fields.
      properties:
        calculation_session_id:
          type: string
          format: uuid
          description: Server-issued modal calculation session id from POST .../official-calculation-sessions/.
            First successful calculation in the session is billed; later ones are
            free.
        idempotency_key:
          type: string
          minLength: 1
          description: Required retry key for exact-once official calculation billing.
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        pricebook_item_id:
          type: integer
        coefficient_set_id:
          type: integer
          nullable: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,6})?$
        values:
          type: array
          items:
            type: string
            format: decimal
            pattern: ^-?\d{0,18}(?:\.\d{0,6})?$
          description: Indexed input values for v2 items. Supersedes quantity when
            provided.
        manual_unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
          nullable: true
        custom_prices:
          type: object
          additionalProperties:
            type: string
            format: decimal
            pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
          description: Optional per-row custom unit prices keyed by six-digit row_code.
        pricebook_row_id:
          type: integer
          nullable: true
        selected_row_id:
          type: integer
          nullable: true
          description: Row selection for itemized items.
        footnotes:
          type: object
          additionalProperties: {}
          nullable: true
          description: Map of footnote_code to bool — applied checkboxes for this
            calculation.
      required:
      - calculation_session_id
      - idempotency_key
      - pricebook_item_id
    OfficialCalculationSession:
      type: object
      properties:
        calculation_session_id:
          type: string
          format: uuid
        document_id:
          type: integer
        pricebook_item_id:
          type: integer
        company_id:
          type: integer
        is_paid:
          type: boolean
        expires_at:
          type: string
          format: date-time
        official_calculation_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,0})?$
      required:
      - calculation_session_id
      - company_id
      - document_id
      - expires_at
      - is_paid
      - official_calculation_cost
      - pricebook_item_id
