            multiple editions.
        calculation_receipt_id:
          type: integer
          nullable: true
          description: Id of a paid calculation billing receipt (from the official/starred
            calculation endpoints). When provided, the line is created directly from
            the receipt and no other calculation fields are read.
        coefficient_set_id:
          type: integer
          nullable: true
          description: Optional line-level coefficient set. Omit to use the document
            default; null disables coefficients.
        line_source:
          $ref: '#/components/schemas/LineSourceEnum'
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,6})?$
          nullable: true
        manual_unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
          nullable: true
        custom_prices:
          type: object
          additionalProperties:
            type: string
            format: decimal
            pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
          description: Optional per-row custom unit prices keyed by six-digit row_code.
        title_fa:
          type: string
        description:
          type: string
        description_snapshot:
          type: string
        unit:
          type: string
        unit_snapshot:
          type: string
        pricebook_row_id:
          type: integer
          nullable: true
        values:
          type: array
          items:
            type: string
            format: decimal
            pattern: ^-?\d{0,18}(?:\.\d{0,6})?$
          description: Indexed input values for v2 items. Supersedes quantity when
            provided.
        selected_row_id:
          type: integer
          nullable: true
          description: Row selection for itemized items.
        footnotes:
          type: object
          additionalProperties: {}
          nullable: true
          description: Map of footnote_code to bool — applied checkboxes for this
            calculation.
