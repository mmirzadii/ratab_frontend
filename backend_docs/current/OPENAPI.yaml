  /api/companies/{id}/members/:
    get:
      operationId: companies_members_list
      parameters:
      - in: query
        name: active_only
        schema:
          type: boolean
        description: When true, return only active company members (picker-safe).
          Employees always receive active members only.
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این company را شناسایی میکند.
        required: true
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search active/listed members by display name, title, or phone.
