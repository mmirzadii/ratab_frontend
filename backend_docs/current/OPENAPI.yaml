  /api/companies/{id}/token-donations/:
    get:
      operationId: companies_token_donations_list
      description: List token donations to this company. Owners and admins see all
        donations; other active members see only their own.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این company را شناسایی میکند.
        required: true
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      tags:
      - companies
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyTokenDonationList'
          description: ''
    post:
      operationId: companies_token_donations_create
      description: 'Donate tokens from the caller''s personal wallet into this company''s
        wallet. Returns the donation plus updated personal and company balances. Exact
        replay returns 200 with Idempotent-Replayed: true.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این company را شناسایی میکند.
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyTokenDonationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyTokenDonationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyTokenDonationCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyTokenDonationResult'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyTokenDonationResult'
          description: ''
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBillingError'
