openapi: 3.0.3
info:
  title: ratab v1.0 Backend API
  version: '1.0'
  description: OpenAPI schema for ratab v1.0 backend. Browser clients use the server-side
    session cookie and must send X-CSRFToken on state-changing session-authenticated
    requests. Obtain a CSRF token from GET /api/auth/csrf/. Temporary local token
    authentication remains available only through the guarded compatibility endpoint.
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Set the readable CSRF cookie and return its masked token for browser
        authentication requests. This endpoint does not create a session.
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
          description: ''
  /api/auth/dev-login/:
    post:
      operationId: auth_dev_login_create
      description: Temporary dev/demo login. Returns 404 when ENABLE_DEV_LOGIN is
        false.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevLoginResponse'
          description: ''
        '404':
          description: Dev login is disabled by ENABLE_DEV_LOGIN=false.
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate with normalized phone number and password, rotate
        the session, and set the persistent HttpOnly session cookie. Login errors
        do not reveal which credential failed. Browser clients must first call GET
        /api/auth/csrf/ with credentials enabled, then send the csrf_token value in
        X-CSRFToken and retain the session cookie.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthResponse'
          description: ''
        '400':
          description: Invalid request.
        '403':
          description: CSRF validation failed.
        '429':
          description: Login rate limit exceeded.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Invalidate the current server-side session and expire its cookie.
        Browser clients must first call GET /api/auth/csrf/ with credentials enabled,
        then send the csrf_token value in X-CSRFToken and retain the session cookie.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '403':
          description: CSRF validation failed.
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Return the current token- or session-authenticated user.
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
          description: ''
  /api/auth/me/invitations/:
    get:
      operationId: auth_me_invitations_list
      description: List pending company invitations for the authenticated user.
      parameters:
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyMembershipInvitationList'
          description: ''
  /api/auth/signup/complete/:
    post:
      operationId: auth_signup_complete_create
      description: 'Consume a one-time signup ticket, hash the chosen password, create
        the account, rotate the session, and authenticate the browser. Password policy:
        minimum length 6 only; shorter passwords return a JSON field error on `password`
        without consuming a still-valid ticket. Browser clients must first call GET
        /api/auth/csrf/ with credentials enabled, then send the csrf_token value in
        X-CSRFToken and retain the session cookie.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCompleteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupCompleteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupCompleteRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthResponse'
          description: ''
        '400':
          description: Invalid ticket or password validation failure.
        '403':
          description: CSRF validation failed.
        '429':
          description: Signup completion rate limit exceeded.
        '503':
          description: Local signup verification is unavailable.
  /api/auth/signup/start/:
    post:
      operationId: auth_signup_start_create
      description: Start the local signup flow without sending or storing an SMS code.
        Browser clients must first call GET /api/auth/csrf/ with credentials enabled,
        then send the csrf_token value in X-CSRFToken and retain the session cookie.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupStartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupStartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupStartRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupStartResponse'
          description: ''
        '400':
          description: Invalid or already registered phone number.
        '403':
          description: CSRF validation failed.
        '429':
          description: Signup start rate limit exceeded.
        '503':
          description: Local signup verification is unavailable.
  /api/auth/signup/verify/:
    post:
      operationId: auth_signup_verify_create
      description: Verify a live local challenge with any non-empty numeric code and
        issue a short-lived one-time signup ticket. The code is never stored. Browser
        clients must first call GET /api/auth/csrf/ with credentials enabled, then
        send the csrf_token value in X-CSRFToken and retain the session cookie.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupVerifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupVerifyResponse'
          description: ''
        '400':
          description: Invalid, expired, or used signup challenge.
        '403':
          description: CSRF validation failed.
        '429':
          description: Signup verification rate limit exceeded.
        '503':
          description: Local signup verification is unavailable.
