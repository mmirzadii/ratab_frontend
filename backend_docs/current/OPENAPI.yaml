        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,0})?$
          readOnly: true
        balance_after:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,0})?$
          readOnly: true
        reason:
          type: string
          readOnly: true
        usage_id:
          type: integer
          nullable: true
          readOnly: true
        company_id:
          type: integer
          nullable: true
          readOnly: true
        document_id:
          type: integer
          nullable: true
          readOnly: true
        line_id:
          type: integer
          nullable: true
          readOnly: true
        row_code:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - balance_after
      - company_id
      - created_at
      - document_id
      - id
      - line_id
      - reason
      - row_code
      - transaction_type
      - usage_id
    TransactionTypeEnum:
      enum:
      - initial_grant
      - manual_grant
      - pricebook_line_usage
      - token_package_purchase
      - calculation_usage
      - company_donation_debit
      - demo_package_credit
      - admin_adjustment_grant
      - admin_adjustment_debit
      - admin_adjustment_refund
      - admin_adjustment_reversal
      type: string
      description: |-
        * `initial_grant` - Initial grant
        * `manual_grant` - Manual grant
        * `pricebook_line_usage` - Pricebook line usage
        * `token_package_purchase` - Token package purchase
        * `calculation_usage` - Calculation usage
        * `company_donation_debit` - Company donation debit
        * `demo_package_credit` - Demo package credit
        * `admin_adjustment_grant` - Admin adjustment grant
        * `admin_adjustment_debit` - Admin adjustment debit
        * `admin_adjustment_refund` - Admin adjustment refund
        * `admin_adjustment_reversal` - Admin adjustment reversal
    TransferRoot:
      type: object
      properties:
        phone_number:
          type: string
          maxLength: 20
        user_id:
          type: integer
        reason:
          type: string
          maxLength: 500
        keep_previous_as_admin:
          type: boolean
          default: true
      required:
      - reason
    TransferRootRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          maxLength: 20
        user_id:
          type: integer
        reason:
          type: string
          minLength: 1
          maxLength: 500
        keep_previous_as_admin:
          type: boolean
          default: true
      required:
      - reason
    UploadStatusEnum:
      enum:
      - pending
      - ready
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `ready` - Ready
        * `failed` - Failed
    UserSubscriptionStatus:
      type: object
      description: |-
        One effective plan for the authenticated user.

        ``has_active_subscription`` / ``has_paid_subscription`` mean a stored paid
        UserSubscription row is currently valid. The free Bronze fallback is never
        a paid subscription row; it appears via ``is_free_fallback`` and
        ``effective_plan_code``.
      properties:
        has_active_subscription:
          type: boolean
          readOnly: true
        has_paid_subscription:
          type: boolean
          readOnly: true
        effective_plan_code:
          type: string
          readOnly: true
          nullable: true
        effective_plan_title_fa:
          type: string
          readOnly: true
          nullable: true
        is_free_fallback:
          type: boolean
          readOnly: true
        plan_code:
          type: string
          readOnly: true
          nullable: true
        plan_title_fa:
          type: string
          readOnly: true
          nullable: true
        status:
          type: string
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        effective_daily_message_limit:
          type: integer
          readOnly: true
          nullable: true
        effective_max_attachment_bytes:
          type: integer
          readOnly: true
          nullable: true
      required:
      - effective_daily_message_limit
      - effective_max_attachment_bytes
      - effective_plan_code
      - effective_plan_title_fa
      - ends_at
      - has_active_subscription
      - has_paid_subscription
      - is_free_fallback
      - plan_code
      - plan_title_fa
      - starts_at
      - status
    WalletTransactionAdmin:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        wallet_id:
          type: integer
          readOnly: true
        transaction_type:
          $ref: '#/components/schemas/TransactionTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,0})?$
        balance_after:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,0})?$
        actor_user_id:
          type: integer
          nullable: true
          readOnly: true
        reason:
          type: string
          maxLength: 240
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor_user_id
      - amount
      - balance_after
      - created_at
      - id
      - transaction_type
      - wallet_id
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Token authentication. Use the format: Token <token>.'
