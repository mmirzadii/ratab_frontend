components:
  schemas:
    ActivePriceSet:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
        title_fa:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - code
      - id
      - is_active
      - title_fa
    Adjustment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        target_user_id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/AdjustmentKindEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,0})?$
        reason:
          type: string
          maxLength: 500
        reference:
          type: string
          maxLength: 120
        status:
          $ref: '#/components/schemas/AdjustmentStatusEnum'
        requested_by_id:
          type: integer
          readOnly: true
        approved_by_id:
          type: integer
          nullable: true
          readOnly: true
        applied_by_id:
          type: integer
          nullable: true
          readOnly: true
        break_glass:
          type: boolean
        idempotency_key:
          type: string
          maxLength: 128
        ledger_transaction_id:
          type: integer
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        applied_at:
          type: string
          format: date-time
          nullable: true
      required:
      - amount
      - applied_by_id
      - approved_by_id
      - created_at
      - id
      - idempotency_key
      - kind
      - ledger_transaction_id
      - reason
      - requested_by_id
      - target_user_id
    AdjustmentKindEnum:
      enum:
      - grant
      - debit
      - refund
      - reversal
      type: string
      description: |-
        * `grant` - Grant
        * `debit` - Debit
        * `refund` - Refund
        * `reversal` - Reversal
    AdjustmentRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/AdjustmentKindEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,0})?$
        reason:
          type: string
          minLength: 1
          maxLength: 500
        reference:
          type: string
          maxLength: 120
        status:
          $ref: '#/components/schemas/AdjustmentStatusEnum'
        break_glass:
          type: boolean
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        approved_at:
          type: string
          format: date-time
          nullable: true
        applied_at:
          type: string
          format: date-time
          nullable: true
      required:
      - amount
      - idempotency_key
      - kind
      - reason
    AdjustmentStatusEnum:
      enum:
      - requested
      - approved
      - rejected
      - applied
      type: string
      description: |-
        * `requested` - Requested
        * `approved` - Approved
        * `rejected` - Rejected
        * `applied` - Applied
