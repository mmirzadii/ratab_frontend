components:
  schemas:
    ActivePriceSet:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
        title_fa:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - code
      - id
      - is_active
      - title_fa
    AppUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - display_name
      - id
      - is_active
      - is_staff
      - phone_number
      - updated_at
    AppliedCoefficient:
      type: object
      properties:
        coefficient_value_id:
          type: integer
        coefficient_key:
          type: string
        key:
          type: string
        label_fa:
          type: string
        title_fa:
          type: string
        scope:
          type: string
        multiplier:
          type: string
        value:
          type: string
        factor:
          type: string
        target_id:
          type: integer
          nullable: true
        priority_source:
          type: string
        row_id:
          type: integer
        row_code:
          type: string
        amount_before:
          type: string
        amount_after:
          type: string
        effect_amount:
          type: string
      required:
      - amount_after
      - amount_before
      - coefficient_key
      - coefficient_value_id
      - effect_amount
      - label_fa
      - multiplier
      - scope
    AttachmentTypeEnum:
      enum:
      - file
      - financial_document
      type: string
      description: |-
        * `file` - File
        * `financial_document` - Financial document
    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 180
        legal_name:
          type: string
          maxLength: 240
        registration_number:
          type: string
          maxLength: 80
        national_id:
          type: string
          maxLength: 80
        active_slug:
          type: string
          nullable: true
          maxLength: 80
        owner_member_id:
          type: integer
          readOnly: true
        public_group_id:
          type: integer
          nullable: true
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - name
      - owner_member_id
      - public_group_id
      - updated_at
    CompanyGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company_id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 240
        description:
          type: string
        created_by_member_id:
          type: integer
          readOnly: true
        group_type:
          type: string
          readOnly: true
        pin_priority:
          type: integer
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
        project_id:
          type: integer
          nullable: true
          readOnly: true
        project:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company_id
      - created_at
      - created_by_member_id
      - group_type
      - id
      - is_active
      - is_default
      - name
      - pin_priority
      - project
      - project_id
      - updated_at
    CompanyGroupMemberAddRequest:
      type: object
      properties:
        member_id:
          type: integer
          minimum: 1
      required:
      - member_id
    CompanyGroupMembership:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        group_id:
          type: integer
          readOnly: true
        member_id:
          type: integer
