  /api/pricebook-items/{id}/calculate/:
    post:
      operationId: pricebook_items_calculate_create
      description: Price an official pricebook calculation inside a modal session.
        Requires financial_document_id, calculation_session_id, and idempotency_key.
        The first successful calculation in the session is charged (personal then
        company wallet); later successful recalculations in the same open session
        are free. Pass the returned receipt id as calculation_receipt_id to POST /api/financial-documents/{id}/lines/
        to materialize the line.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این pricebook logical item را شناسایی میکند.
        required: true
      tags:
      - pricebook-items
