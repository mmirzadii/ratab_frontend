            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyGroupList'
          description: ''
    post:
      operationId: companies_groups_create
      description: Create a custom/normal company group. Accepts name, optional description,
        and optional member_ids of active company members. The creator becomes an
        active group member immediately; selected members receive pending group invitations
        (no message access until accept). Public and project group types cannot be
        created here.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این company را شناسایی میکند.
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyGroupCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyGroupCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyGroupCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyGroupCreateResult'
          description: ''
