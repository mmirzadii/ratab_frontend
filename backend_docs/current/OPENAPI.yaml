        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricebookCalculateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PricebookCalculateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PricebookCalculateInputRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationBillingResult'
          description: Idempotent replay of an already-billed calculation.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationBillingResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualPriceValidationError'
          description: Validation error. Blank-price/manual-price rows return requires_manual_unit_price=true.
            Multi-row items return requires_row_selection=true when pricebook_row_id
            is not provided.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedTokenBillingError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBillingError'
          description: ''
