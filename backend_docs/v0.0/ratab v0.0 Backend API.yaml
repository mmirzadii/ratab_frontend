openapi: 3.0.3
info:
  title: ratab v0.0 Backend API
  version: '0.0'
  description: 'OpenAPI schema for ratab v0.0 backend. Use Authorization: Token <token>
    for protected endpoints.'
paths:
  /api/auth/dev-login/:
    post:
      operationId: auth_dev_login_create
      description: Temporary dev/demo login. Returns 404 when ENABLE_DEV_LOGIN is
        false.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevLoginResponse'
          description: ''
        '404':
          description: Dev login is disabled by ENABLE_DEV_LOGIN=false.
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
          description: ''
  /api/coefficient-sets/{id}/values/:
    get:
      operationId: coefficient_sets_values_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این project coefficient set را شناسایی میکند.
        required: true
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      tags:
      - coefficient-sets
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectCoefficientValueList'
          description: ''
    post:
      operationId: coefficient_sets_values_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این project coefficient set را شناسایی میکند.
        required: true
      tags:
      - coefficient-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCoefficientValueRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectCoefficientValueRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectCoefficientValueRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCoefficientValue'
          description: ''
  /api/coefficient-values/{id}/:
    patch:
      operationId: coefficient_values_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این project coefficient value را شناسایی
          میکند.
        required: true
      tags:
      - coefficient-values
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectCoefficientValueRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProjectCoefficientValueRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectCoefficientValueRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCoefficientValue'
          description: ''
    delete:
      operationId: coefficient_values_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این project coefficient value را شناسایی
          میکند.
        required: true
      tags:
      - coefficient-values
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Coefficient value deleted.
  /api/companies/:
    get:
      operationId: companies_list
      parameters:
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      tags:
      - companies
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyList'
          description: ''
    post:
      operationId: companies_create
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
  /api/companies/{id}/:
    get:
      operationId: companies_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این company را شناسایی میکند.
        required: true
      tags:
      - companies
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    patch:
      operationId: companies_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این company را شناسایی میکند.
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
  /api/companies/{id}/members/:
    get:
      operationId: companies_members_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این company را شناسایی میکند.
        required: true
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      tags:
      - companies
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyMemberList'
          description: ''
  /api/companies/{id}/projects/:
    get:
      operationId: companies_projects_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این company را شناسایی میکند.
        required: true
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      tags:
      - companies
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectList'
          description: ''
    post:
      operationId: companies_projects_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این company را شناسایی میکند.
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/financial-document-exports/{id}/download/:
    get:
      operationId: financial_document_exports_download_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این financial document export را شناسایی
          میکند.
        required: true
      tags:
      - financial-document-exports
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportNotReady'
          description: Export is failed/not ready or has no file in v0.0 blocked PDF
            mode.
  /api/financial-document-lines/{id}/:
    patch:
      operationId: financial_document_lines_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این financial document line را شناسایی میکند.
        required: true
      tags:
      - financial-document-lines
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFinancialDocumentLineUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFinancialDocumentLineUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFinancialDocumentLineUpdateRequest'
