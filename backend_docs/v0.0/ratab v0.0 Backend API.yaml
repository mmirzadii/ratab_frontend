  /api/pricebook-items/:
    get:
      operationId: pricebook_items_list
      parameters:
      - in: query
        name: chapter_id
        schema:
          type: integer
      - in: query
        name: edition_id
        schema:
          type: integer
      - in: query
        name: group_id
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - in: query
