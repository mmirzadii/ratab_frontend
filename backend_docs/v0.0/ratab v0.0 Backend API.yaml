  /api/financial-documents/{id}/:
    get:
      operationId: financial_documents_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این financial document را شناسایی میکند.
        required: true
      tags:
      - financial-documents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialDocument'
          description: ''
    patch:
      operationId: financial_documents_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این financial document را شناسایی میکند.
        required: true
      tags:
      - financial-documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFinancialDocumentUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFinancialDocumentUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFinancialDocumentUpdateRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialDocument'
          description: ''
  /api/financial-documents/{id}/exports/:
    post:
      operationId: financial_documents_exports_create
      description: Creates export metadata. v0.0 PDF binary rendering is blocked/unavailable,
        so exports may be created with failed status and no file_id.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این financial document را شناسایی میکند.
        required: true
      tags:
      - financial-documents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialDocumentExport'
          description: ''
  /api/financial-documents/{id}/lines/:
    post:
      operationId: financial_documents_lines_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این financial document را شناسایی میکند.
        required: true
      tags:
      - financial-documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialDocumentLineCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FinancialDocumentLineCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FinancialDocumentLineCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialDocumentLine'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualPriceLineValidationError'
          description: Validation error. Blank-price/manual-price rows return requires_manual_unit_price=true.
            Multi-row items return requires_row_selection=true when pricebook_row_id
            is not provided.
  /api/financial-documents/{id}/lock/:
    post:
      operationId: financial_documents_lock_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این financial document را شناسایی میکند.
        required: true
      tags:
      - financial-documents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialDocument'
          description: ''
  /api/financial-documents/{id}/preview/:
    get:
      operationId: financial_documents_preview_retrieve
      description: Returns server-rendered Persian RTL HTML preview for the document.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: یک مقداد عدد یکتا که این financial document را شناسایی میکند.
        required: true
      tags:
      - financial-documents
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: ''
  /api/financial-documents/{id}/recalculate/:
    post:
